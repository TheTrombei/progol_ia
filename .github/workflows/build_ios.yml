name: Build iOS IPA (Sin Mac)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compilar ProgolIA.ipa para iPhone
    runs-on: macos-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar iOS sin firma de código (--no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar Runner.app dentro de ProgolIA.ipa
        run: |
          echo "Creando estructura Payload para Sideloading..."
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ProgolIA.ipa Payload
          echo "Archivo ProgolIA.ipa generado exitosamente."
          ls -lh ProgolIA.ipa

      - name: Subir artefacto descargable ProgolIA.ipa
        uses: actions/upload-artifact@v4
        with:
          name: ProgolIA-iOS-IPA
          path: ProgolIA.ipa
          retention-days: 14
